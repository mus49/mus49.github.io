{{ define "main" }}
<main class="section-list">
    <nav class="back-nav">
        <a href="/" class="back-link">← Home</a>
    </nav>

    <h1>Research</h1>

    <ul class="article-list">
        {{ range .Pages }}
        <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ if .Params.description }}
            <p class="muted">{{ .Params.description }}</p>
            {{ else if .Summary }}
            <p class="muted">{{ .Summary }}</p>
            {{ end }}
        </li>
        {{ end }}
    </ul>
</main>
{{ end }}
