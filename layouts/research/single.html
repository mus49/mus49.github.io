{{ define "main" }}
<main class="article">
    <nav class="back-nav">
        <a href="/research/" class="back-link">←</a>
    </nav>

    <article>
        <h1>{{ .Title }}</h1>
        {{ if .Params.date }}
        <p class="article-meta muted">{{ .Date.Format "January 2, 2006" }}</p>
        {{ end }}
        <div class="article-content">
            {{ .Content }}
        </div>
    </article>
</main>
{{ end }}
